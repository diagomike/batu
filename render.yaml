# Render blueprint: the Batu app as an API server for the assistant (free plan).
# Render dashboard -> New -> Blueprint -> pick this repository. It asks for GEMINI_API_KEY.
services:
  - type: web
    name: batu-ask
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GEMINI_API_KEY
        sync: false            # you paste it in the Render dashboard; never commit it
      - key: ALLOWED_ORIGINS
        value: https://diagomike.github.io
      - key: ASK_DAILY_LIMIT
        value: "300"           # AI answers per day; after that the assistant quotes records
      - key: DEFAULT_LANG
        value: en
      - key: ADMIN_TOKEN
        generateValue: true    # random, so the staff desk on this public server is not open
      - key: SECRET_KEY
        generateValue: true    # signs studio sign-in cookies
      - key: STUDIO_SETUP_TOKEN
        generateValue: true    # needed once, to create the first studio account at /admin
      # Database: until DATABASE_URL is set the app uses SQLite on the service's disk, which Render
      # wipes on every deploy (requests and studio edits are lost). To keep them, uncomment this and
      # the "databases" block at the end. See DEPLOY.md before turning it on: it creates a paid resource.
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: batu-db
      #     property: connectionString

# PostgreSQL for requests, payments, studio content and accounts (see DEPLOY.md).
# Uncomment to create it on the next blueprint sync. "free" expires after 30 days on Render;
# use "basic-256mb" (about $6/month) for the real site.
# databases:
#   - name: batu-db
#     plan: basic-256mb
#     region: frankfurt
#     databaseName: batu
#     user: batu
