# The production set-up on one computer: the portal plus PostgreSQL.
#   docker compose up --build        then open http://localhost:8000 (studio: /admin)
# The first studio account needs STUDIO_SETUP_TOKEN below (or open /admin from this computer).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: batu
      POSTGRES_USER: batu
      POSTGRES_PASSWORD: batu-local-only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U batu -d batu"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://batu:batu-local-only@db:5432/batu
      SECRET_KEY: change-me-local-only-0123456789abcdef
      STUDIO_SETUP_TOKEN: local-setup-token-change-me
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DEFAULT_LANG: en

volumes:
  pgdata:
